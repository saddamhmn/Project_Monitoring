<svg width="70" height="70"
     viewBox="10 10 70 70"
     xmlns="http://www.w3.org/2000/svg"
     class="w-auto h-10 text-gray-900 dark:text-white">

  <style>
    .s {
      stroke: currentColor;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>

  <g class="s" stroke-width="5">

    <!-- outer arc kiri atas -->
    <path d="M22 26
             A34 34 0 0 0 12 50" />

    <!-- outer arc kanan atas -->
    <path d="M68 26
             A34 34 0 0 1 78 50" />

    <!-- garis horizontal -->
    <line x1="12" y1="50" x2="78" y2="50" />

    <!-- atap (curve halus, bukan garis lurus) -->
    <path d="M20 50
             Q34 44 40 40
             L50 40
             Q56 44 70 50" />

    <!-- dome tengah -->
    <path d="M32 50
             A13 13 0 0 0 58 50" />

    <!-- outer arc bawah (LINGKARAN BESAR SESUAI TRACING) -->
    <path d="M22 66
             A30 30 0 0 0 68 66" />

  </g>

</svg>